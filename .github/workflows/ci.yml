name: CI

on:
  push:
    branches:
      - master
      - workshop
    tags:
      - "step.*"
  pull_request:
    branches:
      - master
      - workshop

jobs:
  workshop-steps:
    runs-on: ubuntu-latest
    env:
      # There are no Bitcoin Core v32 release binaries yet, so build the branch
      # from source. Once v32.0 is out, download the release instead.
      BITCOIN_BRANCH: "32.x"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Cap'n Proto and Bitcoin Core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential cmake python3 libboost-dev capnproto libcapnp-dev ccache

      - name: Resolve Bitcoin Core commit
        id: bitcoin-commit
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/bitcoin/bitcoin.git "refs/heads/${BITCOIN_BRANCH}" | cut -f1)"
          test -n "${commit}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache Bitcoin Core build
        id: bitcoin-cache
        uses: actions/cache@v5
        with:
          path: bitcoin-core
          key: bitcoin-core-${{ runner.os }}-${{ steps.bitcoin-commit.outputs.commit }}

      # Speeds up the build when the branch has moved since the cached build.
      - name: Cache ccache
        if: steps.bitcoin-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ steps.bitcoin-commit.outputs.commit }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build Bitcoin Core
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -x bitcoin-core/bin/bitcoin ]]; then
            git clone --depth 1 --branch "${BITCOIN_BRANCH}" https://github.com/bitcoin/bitcoin.git "${RUNNER_TEMP}/bitcoin-src"
            cmake -S "${RUNNER_TEMP}/bitcoin-src" -B "${RUNNER_TEMP}/bitcoin-build" \
              -DENABLE_WALLET=OFF -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build "${RUNNER_TEMP}/bitcoin-build" -j "$(nproc)" \
              --target bitcoin bitcoin-node bitcoin-cli
            mkdir -p bitcoin-core/bin
            cp "${RUNNER_TEMP}/bitcoin-build/bin/"{bitcoin,bitcoin-node,bitcoin-cli} bitcoin-core/bin/
          fi

          ./bitcoin-core/bin/bitcoin --version

      - name: Start Bitcoin Core
        shell: bash
        run: |
          set -euo pipefail

          ./bitcoin-core/bin/bitcoin node -datadir="${GITHUB_WORKSPACE}/bitcoin" -daemon

          ipc_ready=0
          for _ in {1..60}; do
            if [[ -S "${GITHUB_WORKSPACE}/bitcoin/signet/node.sock" ]]; then
              ipc_ready=1
              break
            fi
            sleep 1
          done

          if [[ "${ipc_ready}" -ne 1 ]]; then
            echo "Bitcoin Core IPC socket was not created"
            exit 1
          fi

          rpc_ready=0
          for _ in {1..60}; do
            if ./bitcoin-core/bin/bitcoin-cli -datadir="${GITHUB_WORKSPACE}/bitcoin" getblockchaininfo; then
              rpc_ready=1
              break
            fi
            sleep 1
          done

          if [[ "${rpc_ready}" -ne 1 ]]; then
            echo "Bitcoin Core RPC did not become ready"
            exit 1
          fi

          for height in $(seq 1 17); do
            block="$(tr -d '\n' < "test/fixtures/block_${height}.hex")"
            ./bitcoin-core/bin/bitcoin-cli \
              -datadir="${GITHUB_WORKSPACE}/bitcoin" \
              submitblock "${block}"
          done

      - name: Check step.1
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.1
          echo "step.1 has no Rust project yet; skipping Rust checks"

      - name: Check step.2
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.2
          echo "step.2 has no Rust project yet; skipping Rust checks"

      - name: Check step.3
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.3
          cargo fmt --check
          cargo check --locked
          cargo run --locked

      - name: Check step.4
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.4
          cargo fmt --check
          cargo check --locked
          cargo run --locked

      - name: Check step.4.solution
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.4.solution
          cargo fmt --check
          cargo check --locked
          cargo run --locked

      - name: Check step.5
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.5
          cargo fmt --check
          cargo check --locked
          cargo run --locked

      - name: Check step.5.solution
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.5.solution
          cargo fmt --check
          cargo check --locked
          cargo run --locked

      - name: Check step.6
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.6
          cargo fmt --check
          cargo check --locked
          timeout 180s cargo run --release --locked -- --ci --threads 2

      - name: Check step.6.solution
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.6.solution
          cargo fmt --check
          cargo check --locked
          timeout 180s cargo run --release --locked -- --ci --threads 2

      - name: Check step.7
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.7
          cargo fmt --check
          cargo check --locked
          timeout 180s cargo run --release --locked -- --ci --threads 2

      - name: Check step.7.solution
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force step.7.solution
          cargo fmt --check
          cargo check --locked
          timeout 180s cargo run --release --locked -- --ci --threads 2

      - name: Stop Bitcoin Core
        if: always()
        run: ./bitcoin-core/bin/bitcoin-cli -datadir="${GITHUB_WORKSPACE}/bitcoin" stop || true
